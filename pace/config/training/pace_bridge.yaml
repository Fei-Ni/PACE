# PACE recipe for SimplerEnv (WidowX): BridgeData V2 (data_mix bridge), 100k steps, warm-started from the StarVLA
# Qwen3VL-GR00T-Bridge-RT-1 checkpoint (steps_20000; VLM + action head reloaded non-strictly). Launch with examples/SimplerEnv/train_bridge.sh, which
# only passes the data root, the initial checkpoint and the run directory (plus any --key.path value overrides you
# add; they are printed in the EFFECTIVE line). Note: OmegaConf does not expand shell variables in this file.
run_id: pace_bridge
run_root_dir: runs
seed: 42
trackers: [jsonl]  # "jsonl" -> <run>/metrics.jsonl; add "wandb" for Weights & Biases (entity: wandb_entity or $WANDB_ENTITY)
wandb_entity: null
wandb_project: pace

framework:
  name: PACE
  qwenvl:
    base_vlm: Qwen/Qwen3-VL-4B-Instruct  # env BASE_VLM (local directory or HF id) takes precedence
    attn_implementation: flash_attention_2  # env PACE_ATTN_IMPLEMENTATION (e.g. sdpa) overrides
  action_model:
    action_model_type: DiT-B  # 12 heads x 64, 16 layers (diffusion_model_cfg.num_layers)
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7  # the state encoder exists in the checkpoint, but no proprioceptive state is fed
    future_action_window_size: 15
    action_horizon: 16  # action chunk H = future_action_window_size + 1
    past_action_window_size: 0
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4  # flow-matching (Euler) denoising steps
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  progress:
    layer_idx: 18  # query readouts from the hidden states of VLM layer 18
    num_goal_queries: 4  # K goal queries, mean-pooled into the foresight-anchor head
    use_goal_dit_token: true  # the predicted anchor is a DiT conditioning token (besides p_cur and dp_cur)
    lambda_long: 0.1  # goal-anchor loss (MSE in DINOv2 space)
    lambda_pcur: 0.1  # current-progress loss
    lambda_dpcur: 0.1  # forward-commitment loss
    lambda_cons: 0.1  # consistency: p_cur readout vs projection onto the predicted anchor
    cons_detach_anchor: true
    query_init_std: 0.01
    train_query_token_rows_only: true  # new token rows are trained; the rest of the VLM is fully fine-tuned
    progress_future_offset: 15  # Delta (history / commitment horizon in env steps); equals datasets.vla_data value
    use_history_images: true  # the frame at t - Delta is an extra VLM input
    use_dp_prev_input: true  # the historical pace dp_prev enters the VLM as a token
    use_full_goal_anchor_at_inference: true
    infer_history_mode: step_aligned
    dino_variant: vitb14  # frozen DINOv2 ViT-B/14 (progress geometry)
    dino_target_dim: 768
    dino_head_hidden_dim: 1024
    dino_repo_root: null  # null -> vendored third_party/dinov2 (env DINO_REPO_ROOT overrides)
    dino_weights: null  # null -> $PACE_CACHE/dinov2 download (env DINOV2_WEIGHTS overrides)
    # Commitment audit (inference-time failure detector, never changes actions): alarm when the shortfall CUSUM
    # exceeds audit_threshold or p_cur has not risen for more than audit_stall_chunks action chunks.
    # audit_threshold is shared by all benchmarks (unmet commitments adding up to 0.4 of the task); the stall limit is
    # calibrated per benchmark on held-out checkpoints (2.5% false alarms on successful episodes); see docs/PROGRESS.md.
    audit_kappa: 0.0
    audit_threshold: 0.4
    audit_stall_chunks: 2.12

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: datasets/OXE_LEROBOT_DATASET  # placeholder; train_bridge.sh passes $DATA_ROOT
    data_mix: bridge  # single view image_0, resized to 224x224
    image_size: [224, 224]  # inference-time resize of the client images
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 16
    strict_sample_errors: true
    sample_max_retries: 1
    return_progress_anchors: true
    progress_future_offset: 15

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 10000
  learning_rate:
    base: 1.0e-05  # progress heads, conditioning MLPs
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1  # 4 GPUs x 16 x 1 = global batch 64
  repeated_diffusion_steps: 4  # noise/time samples per example in the flow-matching loss
  optimizer:  # AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  # Warm start: StarVLA/Qwen3VL-GR00T-Bridge-RT-1 (Hugging Face), checkpoints/steps_20000_pytorch_model.pt.
  pretrained_checkpoint: checkpoints/Qwen3VL-GR00T-Bridge-RT-1/checkpoints/steps_20000_pytorch_model.pt  # placeholder
  reload_modules: qwen_vl_interface,action_model
  reload_strict: false  # vocabulary rows are merged; new PACE modules keep their initialisation
  state_save_interval: 5000  # keep a resumable accelerate state in <run>/latest_state every N steps
  resume_from_latest: true
